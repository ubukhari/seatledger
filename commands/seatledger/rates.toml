# /seatledger:rates — explain step changes in how coding-agent requests use tokens.
description = "Explain step changes in tokens per request, cache use, tokens per turn and Codex quota per token, with the client version where each starts."
prompt = """
Explain whether the same coding-agent work started costing a different number of tokens.
seatledger (`seatledger` on npm, MIT) reads this machine's Claude Code and Codex transcripts and
looks, per client and model, for days where the way requests use tokens stepped and stayed. It
makes no network calls and sends nothing anywhere.

1. Run with the shell tool (the user confirms the command):
   npx -y seatledger@latest rates {{args}}

2. For each finding, newest first: what moved, from when, by how much, on which model, the client
   version in use from that day and whether it was the first day on it. Quote the before and after
   values and their day ranges.

3. Say what it is consistent with, in the finding's own words. seatledger sees this machine's
   requests, not the vendor's servers, so it never states a cause and neither should you. A change
   in the share of cache writes at the 1-hour lifetime is recorded in the transcript itself, and
   Codex's window percentages are Codex's own; those two are observations.

4. If no version change coincides, the user's own work (a new repository, a bigger task, more
   subagents, a model setting) moves these numbers too; ask what changed on their side.

5. No findings means no step of at least 30% (10 points for shares) that held for several days.
   Read the "Current baselines" table back briefly. Do not file anything on the user's behalf.
"""
